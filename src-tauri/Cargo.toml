[package]
name = "crabui"
version = "1.0.0"
description = "CrabUI for Typora · Crab 主题排版管理器"
authors = ["yixing233"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crabui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：预览 iframe 需要 asset:// 协议加载主题字体，同时才有 asset_protocol_scope()
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 在线更新：只要一个 HTTPS GET 和一个 sha256，别的都不要。
# default-features = false 关掉 charset/http2/gzip 等一堆用不上的东西；native-tls 在 Windows 上
# 就是系统 schannel，走系统证书库，不额外打包一份 CA bundle，也不引入 OpenSSL。
# stream 是为了边收边计数：Content-Length 可以撒谎或干脆不给，只有按 chunk 累加才真封得住内存。
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"

